<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel administrativo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }
        .card {
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
        }
        h1 {
            margin-top: 0;
            font-size: 22px;
            text-align: center;
        }
        p {
            color: #4b5563;
            font-size: 14px;
            text-align: center;
        }
        .acoes {
            margin-top: 24px;
        }
        .botao {
            display: block;
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: #fff;
            border-radius: 4px;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
        .botao:hover {
            background: #1d4ed8;
        }
        .voltar {
            display: block;
            margin-top: 16px;
            font-size: 14px;
            text-align: center;
            color: #2563eb;
        }
        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 16px;
        }
        .messages li {
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Painel administrativo</h1>

        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        <p>Gerencie o acervo e os empréstimos da biblioteca.</p>

        <div class="acoes">
            <a class="botao" href="{% url 'adcionar_livro' %}">Adicionar livros</a>
        </div>

        <a class="voltar" href="{% url 'Catalogo' %}">Voltar para o catálogo</a>
    </div>
</body>
</html>
