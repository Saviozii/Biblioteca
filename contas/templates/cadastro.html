<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #fff;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 360px;
        }
        h1 {
            margin-top: 0;
            font-size: 22px;
            text-align: center;
        }
        label {
            display: block;
            margin: 14px 0 4px;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            margin-top: 22px;
            padding: 11px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }
        button:hover {
            background: #1d4ed8;
        }
        .login-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cadastro</h1>

        <form method="POST">
            {% csrf_token %}

            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required>

            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>

            <label for="turma">Turma</label>
            <select id="turma" name="turma" required>
                <option value="" disabled selected>Selecione a turma</option>
                {% for turma in turmas %}
                    <option value="{{ turma.id }}">{{ turma }}</option>
                {% endfor %}
            </select>

            <button type="submit">Cadastrar</button>
        </form>

        <p class="login-link">
            Já tem conta? <a href="{% url 'login' %}">Entrar</a>
        </p>
    </div>
</body>
</html>
